# Force every secret application.properties can pull in from a developer's gitignored
# application-local.properties (or real env vars) back to unset for test runs - profile-
# specific properties always take precedence over the base file, so this keeps tests
# like "...WhenNoAiProviderIsConfigured" hermetic regardless of what's configured on the
# machine running them, rather than depending on nobody happening to have a local secret set.
app.ai.gateway.base-url=
app.ai.gateway.api-key=
app.ai.gateway.model=
app.ai.anthropic.api-key=
app.ai.anthropic.model=
app.registry.ariregister.base-url=
app.registry.ariregister.username=
app.registry.ariregister.password=
