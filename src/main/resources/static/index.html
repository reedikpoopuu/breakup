<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy Break — Dump your expensive contract</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>

<div class="eb-shell">

  <!-- ============ TOP BAR — LANDING (minimal) ============ -->
  <header id="topbar-landing" class="eb-topbar">
    <div class="eb-topbar-inner">
      <div class="eb-brand" data-action="go-landing">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="24" fill="#1a1712"/><circle cx="50" cy="62" r="32" fill="#1a1712"/><circle cx="50" cy="65" r="19" fill="#faf9f7"/><circle cx="41" cy="30" r="5" fill="#faf9f7"/><circle cx="59" cy="30" r="5" fill="#faf9f7"/><circle cx="50" cy="35" r="4" fill="#b16600"/><circle cx="37" cy="88" r="7" fill="#b16600"/><circle cx="58" cy="92" r="7" fill="#b16600"/></svg>
        <span class="eb-brand-word">Easy Break</span>
      </div>
      <div class="eb-pillrow" style="margin-left:auto" id="lang-pills-landing"></div>
    </div>
  </header>

  <!-- ============ TOP BAR — APP (post-landing global chrome) ============ -->
  <header id="topbar-app" class="eb-topbar eb-hidden">
    <div class="eb-topbar-inner">
      <div class="eb-brand" data-action="go-landing">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="24" fill="#1a1712"/><circle cx="50" cy="62" r="32" fill="#1a1712"/><circle cx="50" cy="65" r="19" fill="#faf9f7"/><circle cx="41" cy="30" r="5" fill="#faf9f7"/><circle cx="59" cy="30" r="5" fill="#faf9f7"/><circle cx="50" cy="35" r="4" fill="#b16600"/><circle cx="37" cy="88" r="7" fill="#b16600"/><circle cx="58" cy="92" r="7" fill="#b16600"/></svg>
      </div>
      <nav class="eb-stepper" id="stepper"></nav>
      <div class="eb-row eb-row-gap-12" style="margin-left:auto">
        <div class="eb-switch-row">
          <span class="eb-switch-label" id="advanced-label">Advanced view</span>
          <button id="advanced-toggle" class="eb-switch" role="switch" aria-checked="false"></button>
        </div>
        <div class="eb-pillrow" id="lang-pills-app"></div>
      </div>
    </div>
    <div class="eb-topbar-inner" style="padding-top:0" id="company-row-wrap">
      <div class="eb-companies" id="company-chips"></div>
      <button class="eb-chip-add" id="add-company-btn" title="New company">+</button>
    </div>
  </header>

  <main class="eb-main">

    <!-- ============ SCREEN 1: LANDING ============ -->
    <section id="screen-landing" class="eb-screen is-active">
      <div class="eb-hero">
        <div class="eb-hero-logo">
          <svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="24" fill="#1a1712"/><circle cx="50" cy="62" r="32" fill="#1a1712"/><circle cx="50" cy="65" r="19" fill="#faf9f7"/><circle cx="41" cy="30" r="5" fill="#faf9f7"/><circle cx="59" cy="30" r="5" fill="#faf9f7"/><circle cx="50" cy="35" r="4" fill="#b16600"/><circle cx="37" cy="88" r="7" fill="#b16600"/><circle cx="58" cy="92" r="7" fill="#b16600"/></svg>
          <span>Easy Break</span>
        </div>
        <h1 id="hero-tagline"></h1>
        <p class="eb-hero-sub" id="hero-sub"></p>
        <div class="eb-hero-countries" id="landing-country-picker"></div>
        <button id="landing-cta" class="eb-btn eb-btn-primary" style="padding:12px 28px;font-size:14px"></button>
        <p style="margin-top:40px"><a href="/admin.html" class="eb-text-sm eb-text-muted">Admin Control Room ↗</a></p>
      </div>
    </section>

    <!-- ============ SCREEN 2: DASHBOARD ============ -->
    <section id="screen-dashboard" class="eb-screen">
      <div class="eb-page">
        <div class="eb-page-head">
          <h2 class="eb-page-title" id="dash-title"></h2>
          <p class="eb-page-sub" id="dash-sub"></p>
        </div>
        <div id="contract-card"></div>
        <div id="dash-cta-wrap" class="eb-mt-24 eb-hidden">
          <button id="dash-cta" class="eb-btn eb-btn-primary"></button>
        </div>
      </div>
    </section>

    <!-- ============ SCREEN 3: RFQ MATRIX ============ -->
    <section id="screen-rfq" class="eb-screen">
      <div class="eb-page eb-page-wide">
        <div class="eb-page-head">
          <h2 class="eb-page-title" id="rfq-title"></h2>
          <p class="eb-page-sub" id="rfq-sub"></p>
        </div>
        <div id="rfq-body"></div>
      </div>
    </section>

    <!-- ============ SCREEN 4: SWITCH & SIGN ============ -->
    <section id="screen-sign" class="eb-screen">
      <div class="eb-page eb-page-narrow">
        <div class="eb-page-head">
          <h2 class="eb-page-title" id="sign-title"></h2>
        </div>
        <div id="sign-body"></div>
        <div class="eb-mt-24">
          <a href="#" class="eb-back-link" data-action="go-dashboard">← <span id="back-to-dashboard-1"></span></a>
        </div>
      </div>
    </section>

    <!-- ============ SCREEN 5: WIN VS SPOT ============ -->
    <section id="screen-win" class="eb-screen">
      <div class="eb-page eb-page-wide">
        <div class="eb-page-head">
          <h2 class="eb-page-title" id="win-title"></h2>
          <p class="eb-page-sub" id="win-sub"></p>
        </div>
        <div id="win-body"></div>
        <div class="eb-mt-24">
          <a href="#" class="eb-back-link" data-action="go-dashboard">← <span id="back-to-dashboard-2"></span></a>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- ============ SMART-ID MODAL (reused: login + sign) ============ -->
<div id="smartid-modal-overlay" class="eb-modal-overlay">
  <div class="eb-modal">
    <div class="eb-modal-head">
      <span class="eb-modal-title" id="smartid-modal-title"></span>
      <button class="eb-modal-close" id="smartid-modal-close" aria-label="Close">✕</button>
    </div>

    <div id="smartid-step-form">
      <p class="eb-text-sm eb-text-muted" id="smartid-hint"></p>
      <div class="eb-row eb-row-gap-8 eb-mt-16">
        <select id="smartid-country" class="eb-select" style="width:80px">
          <option value="EE">EE</option>
          <option value="LV">LV</option>
          <option value="LT">LT</option>
        </select>
        <input id="smartid-national-id" class="eb-input" type="text" inputmode="numeric" value="40504040001">
      </div>
      <button id="smartid-start-btn" class="eb-btn eb-btn-primary eb-btn-block eb-mt-16"></button>
      <p id="smartid-form-error" class="eb-hidden eb-text-sm" style="color:var(--danger-text);margin-top:8px"></p>
    </div>

    <div id="smartid-step-polling" class="eb-hidden">
      <p class="eb-text-sm eb-text-muted" style="text-align:center" id="smartid-confirm-hint"></p>
      <p class="eb-pin" id="smartid-verification-code">····</p>
      <p class="eb-modal-status">
        <svg class="eb-spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        <span id="smartid-waiting-label"></span>
      </p>
      <div style="text-align:center;margin-top:12px">
        <button class="eb-btn-ghost" id="smartid-cancel-btn" style="background:none;border:none;text-decoration:underline;cursor:pointer;font-size:12px;color:var(--gray-500)"></button>
      </div>
    </div>

    <div id="smartid-step-success" class="eb-hidden" style="text-align:center">
      <div class="eb-banner eb-banner-success eb-mt-16" style="justify-content:center"><span id="smartid-success-label"></span></div>
      <button id="smartid-done-btn" class="eb-btn eb-btn-primary eb-btn-block eb-mt-16"></button>
    </div>
  </div>
</div>

<div id="toast" class="eb-toast"></div>

  /* =====================================================================
     Deterministic pseudo-random helpers (stable demo numbers per seed)
     ===================================================================== */
  function hash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; }
    return Math.abs(h);
  }
  function seededFloat(seed, min, max) {
    const r = (hash(seed) % 10000) / 10000;
    return min + r * (max - min);
  }
  function genMonths(seed, base, amplitude) {
    const months = [];
    for (let i = 0; i < 12; i++) {
      const wave = Math.sin((i / 12) * Math.PI * 2 + hash(seed) % 6) * amplitude;
      const noise = seededFloat(seed + i, -amplitude * 0.3, amplitude * 0.3);
      months.push(Math.max(50, Math.round(base + wave + noise)));
    }
    return months;
  }

  async function apiFetch(url, options) {
    const opts = Object.assign({}, options);
    opts.headers = Object.assign({}, opts.headers);
    if (state.auth.token) opts.headers.Authorization = 'Bearer ' + state.auth.token;
    if (opts.body && !opts.headers['Content-Type']) opts.headers['Content-Type'] = 'application/json';
    const res = await fetch(url, opts);
    if (res.status === 204) return null;
    let data = null;
    try { data = await res.json(); } catch (e) { /* no body */ }
    if (!res.ok) {
      const err = new Error((data && data.message) || (res.status + ' ' + res.statusText));
      err.status = res.status;
      throw err;
    }
    return data;
  }

  function computeMetrics(c) {
    const months = c.monthsRaw;
    const avg = months.reduce((a, b) => a + b, 0) / months.length;
    const variance = months.reduce((a, b) => a + Math.pow(b - avg, 2), 0) / months.length;
    const stdev = Math.sqrt(variance);
    const deviation = Math.round((stdev / avg) * 100);
    let volatility = 0;
    for (let i = 1; i < months.length; i++) volatility += Math.abs(months[i] - months[i - 1]);
    volatility = Math.round((volatility / (months.length - 1)) / avg * 100);
    const shapeCost = Math.round(avg * 12 * (stdev / avg) * 0.02);
    return [deviation + '%', volatility + '%', eur(shapeCost) + '/yr'];
  }

  function renderMetrics(c) {
    const vals = computeMetrics(c);
    const rows = [
      ['m_deviation', 'm_deviation_tip'],
      ['m_volatility', 'm_volatility_tip'],

    ];
    return '<hr class="eb-divider">' + rows.map((r, i) =>
      '<div class="eb-metric-row"><span class="eb-metric-name">' + t(r[0]) + ' <span class="eb-tip" title="' + t(r[1]) + '">?</span></span>' +
      '<span class="eb-metric-value">' + vals[i] + '</span>' +
      '<button class="eb-switch' + (c.includeMetrics[i] ? ' is-on' : '') + '" data-metric-toggle="' + i + '" style="margin-left:12px" title="' + t('include_rfq') + '"></button>' +
      '</div>'
    ).join('');
  }

  function selectedOffer(c) {
    return c.quotes.find(x => x.id === c.selectedQuoteId) || c.suppliers.find(x => x.id === c.selectedQuoteId) || null;
  }

  function renderPostSignCard(c, card) {
    const q = selectedOffer(c);
    if (!q) { card.innerHTML = ''; return; }
    const old = c.currentContract;
    card.innerHTML =
      '<div class="eb-banner eb-banner-success"><span>✓</span><div><strong>' + t('post_sign_title') + '</strong><div class="eb-text-sm" style="margin-top:2px">' + t('post_sign_sub') + '</div></div></div>' +
      '<div class="eb-card eb-mt-16">' +
      '<div class="eb-card-title">' + t('new_contract') + '</div>' +
      '<div class="eb-kv"><span class="eb-kv-label">' + t('k_supplier') + '</span><span class="eb-kv-value">' + escapeHtml(q.supplierName) + '</span></div>' +
      '<div class="eb-kv"><span class="eb-kv-label">' + t('k_plan') + '</span><span class="eb-kv-value">' + escapeHtml(q.plan) + '</span></div>' +
      '<div class="eb-kv"><span class="eb-kv-label">' + t('k_rate') + '</span><span class="eb-kv-value">' + eurCents(q.rate) + '</span></div>' +
      '<div class="eb-kv"><span class="eb-kv-label">' + t('starts') + '</span><span class="eb-kv-value">' + q.startDate + '</span></div>' +
      '<hr class="eb-divider">' +
      '<div class="eb-kv"><span class="eb-kv-label">' + escapeHtml(old.supplier) + '</span><span class="eb-badge">' + t('terminated') + '</span></div>' +
      '</div>' +
      (q.type !== 'spot' ? '<div class="eb-mt-16"><a href="#" class="eb-back-link" data-action="go-win">' + t('win_link') + '</a></div>' : '');
  }

  /* =====================================================================
     Render: RFQ Matrix
     ===================================================================== */
  async function ensureSuppliers(c) {
    if (c.suppliers.length) return;
    try {
      const list = await apiFetch('/api/suppliers?country=' + c.company.country);
      c.suppliers = list.map(s => {
        const rate = seededFloat(s.name + s.id, 0.108, 0.158);
        const isSpot = hash(s.name) % 3 === 0;
        const planNames = ['Kindel 12', 'Kindel 24', 'Turuhind+', 'Baas 12', 'Spot Tracker'];
        return {
          id: 'pub-' + s.id, supplierId: s.id, supplierName: s.name, rfqEmail: s.rfqEmail, priceUrl: s.priceUrl,
          plan: planNames[hash(s.name) % planNames.length], rate: rate, type: isSpot ? 'spot' : 'fixed', personalized: false,
        };
      });
    } catch (err) {
      c.suppliers = [];
      toast(t('badge_default') + ': ' + err.message);
    }
  }

  function annualCost(rate, kwh) { return rate * kwh; }

  function netBenefit(c, rate) {
    const current = annualCost(c.currentContract.rate, c.company.annualKwh);
    const candidate = annualCost(rate, c.company.annualKwh);
    return Math.round(current - candidate);
  }

  function rfqRows(c) {
    const rows = c.suppliers.map(s => ({
      id: s.id, supplierName: s.supplierName, plan: s.plan, rate: s.rate, type: s.type, personalized: false,
    }));
    if (c.rfqStage === 'received') {
      c.quotes.forEach(q => rows.push({ id: q.id, supplierName: q.supplierName, plan: q.plan, rate: q.rate, type: q.type, personalized: true }));
    }
    rows.forEach(r => r.benefit = netBenefit(c, r.rate));
    return rows.sort((a, b) => b.benefit - a.benefit);
  }

  async function renderRfq() {
    document.getElementById('rfq-title').textContent = t('rfq_title');
    document.getElementById('rfq-sub').textContent = t('rfq_sub');
    const c = activeCompany();
    const body = document.getElementById('rfq-body');
    if (!c) { body.innerHTML = ''; return; }

    if (c.rfqStage === 'sending') {
      body.innerHTML = '<div class="eb-card"><div class="eb-async"><svg class="eb-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>' +
        '<div><div style="font-weight:700;color:var(--gray-800)">' + t('sending_title') + '</div><div>' + t('sending_sub', { n: c.suppliers.length }) + '</div></div></div></div>';
      return;
    }

    if (!c.suppliers.length) {
      body.innerHTML = '<div class="eb-card"><div class="eb-async">' + t('badge_default') + '…</div></div>';
      await ensureSuppliers(c);
      renderRfq();
      return;
    }

    const rows = rfqRows(c);
    const bestId = rows[0] ? rows[0].id : null;
    const table =
      '<div class="eb-table-wrap"><table class="eb-table"><thead><tr>' +
      '<th></th><th>' + t('col_supplier') + '</th><th>' + t('col_plan') + '</th><th>' + t('col_rate') + '</th><th>' + t('col_benefit') + '</th>' +
      '</tr></thead><tbody>' +
      rows.map(r => {
        const badges = [];
        if (r.id === bestId) badges.push('<span class="eb-badge eb-badge-accent">' + t('badge_recommended') + '</span>');
        if (r.type === 'spot') badges.push('<span class="eb-badge eb-badge-danger">' + t('badge_volatile') + '</span>');
        if (r.personalized) badges.push('<span class="eb-badge eb-badge-success">' + t('badge_personal') + '</span>');
        return '<tr class="' + (r.id === bestId ? 'is-recommended' : '') + '">' +
          '<td><input type="radio" class="eb-radio" name="quote" value="' + r.id + '" ' + (c.selectedQuoteId === r.id ? 'checked' : '') + '></td>' +
          '<td><strong>' + escapeHtml(r.supplierName) + '</strong> ' + badges.join(' ') + '</td>' +
          '<td>' + escapeHtml(r.plan) + '</td>' +
          '<td class="mono">' + eurCents(r.rate) + '</td>' +
          '<td class="mono" style="color:' + (r.benefit >= 0 ? 'var(--success-text)' : 'var(--danger-text)') + '">' + (r.benefit >= 0 ? '+' : '') + eur(r.benefit) + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table></div>';

    const badgeRow = '<div class="eb-row eb-row-gap-8 eb-mt-8"><span class="eb-badge eb-badge-accent">' + t('badge_default') + '</span><span class="eb-text-sm eb-text-muted">' + t('note_public') + '</span></div>';

    const banner = c.rfqStage === 'published'
      ? '<div class="eb-banner eb-banner-accent eb-mt-16"><div><strong>' + t('cta_banner_title') + '</strong><div class="eb-text-sm" style="margin-top:2px">' + t('cta_banner_sub') + '</div></div></div>'
      : '';

    const letter = RFQ_LETTERS[c.company.country];
    const letterHtml = c.showRequestText
      ? '<div class="eb-letter">' + escapeHtml(letter.subject.replace('%s', c.company.name)) + '\n\n' + escapeHtml(letter.body.replace('%s', c.company.name)) + '</div>'
      : '';
    const advanced = state.advancedView
      ? '<div class="eb-card eb-mt-16">' + renderMetrics(c) +
        '<hr class="eb-divider"><button class="eb-toggle-link" id="toggle-request-text">' + (c.showRequestText ? t('hide_request') : t('view_request')) + '</button>' + letterHtml + '</div>'
      : '';

    const monthlyCheckRow = c.rfqStage === 'received'
      ? '<div class="eb-card eb-mt-16"><div class="eb-row eb-row-between"><div><div style="font-weight:600;font-size:13px">' + t('monthly_check') + '</div><div class="eb-text-sm eb-text-muted">' + t('monthly_check_sub') + '</div></div>' +
        '<button class="eb-switch' + (c.monthlyCheck ? ' is-on' : '') + '" id="monthly-check-toggle"></button></div></div>'
      : '';

    const buttons = c.rfqStage === 'published'
      ? '<div class="eb-row eb-row-gap-12 eb-mt-24"><button class="eb-btn eb-btn-primary" id="btn-get-quotes">' + t('btn_get_quotes') + '</button><button class="eb-btn eb-btn-secondary" id="btn-request-contract">' + t('btn_request_contract') + '</button></div>'
      : '<div class="eb-mt-24"><button class="eb-btn eb-btn-primary" id="btn-request-contract">' + t('btn_request_contract') + '</button></div>';

    body.innerHTML = badgeRow + '<div class="eb-mt-8"></div>' + table + banner + advanced + monthlyCheckRow + buttons;
  }

  /* =====================================================================
     Render: Sign
     ===================================================================== */
  function renderSign() {
    document.getElementById('sign-title').textContent = t('sign_title');
    const c = activeCompany();
    const body = document.getElementById('sign-body');
    if (!c || !c.selectedQuoteId) { body.innerHTML = ''; return; }
    const q = selectedOffer(c);
    if (!q) { body.innerHTML = ''; return; }
    const benefit = netBenefit(c, q.rate) - c.currentContract.penalty;
    const startDate = new Date(Date.now() + 14 * 86400000).toISOString().slice(0, 10);
    q.startDate = q.startDate || startDate;

    body.innerHTML =
      '<div class="eb-card">' +
      '<div class="eb-kv"><span class="eb-kv-label">' + t('switching_to') + '</span><span class="eb-kv-value">' + escapeHtml(q.supplierName) + '</span></div>' +
      '<div class="eb-kv"><span class="eb-kv-label">' + t('new_plan') + '</span><span class="eb-kv-value">' + escapeHtml(q.plan) + ' · ' + eurCents(q.rate) + '</span></div>' +
      '<div class="eb-kv"><span class="eb-kv-label">' + t('new_start') + '</span><span class="eb-kv-value">' + q.startDate + '</span></div>' +
      '<hr class="eb-divider">' +
      '<p class="eb-text-sm eb-text-muted">' + t('termination_notice', { supplier: escapeHtml(c.currentContract.supplier), penalty: c.currentContract.penalty }) + '</p>' +
      '<div class="eb-mt-16"><span class="eb-label">' + t('net_benefit') + '</span>' +
      '<div class="eb-figure ' + (benefit >= 0 ? 'is-positive' : 'is-negative') + '">' + (benefit >= 0 ? '+' : '') + eur(benefit) + '</div></div>' +
      '</div>' +
      (c.signCompleted
        ? '<div class="eb-banner eb-banner-success eb-mt-16"><span>✓</span><strong>' + t('signed_banner') + '</strong></div><button class="eb-btn eb-btn-secondary eb-mt-16" id="btn-download-pdf">' + t('btn_download_pdf') + '</button>'
        : '<div class="eb-row eb-row-gap-12 eb-mt-24"><button class="eb-btn eb-btn-primary" id="btn-sign-smartid">' + t('btn_sign') + '</button><button class="eb-btn eb-btn-secondary" id="btn-download-unsigned">' + t('btn_download_unsigned') + '</button></div>');
  }

  /* =====================================================================
     Render: Win vs Spot
     ===================================================================== */
  function renderWin() {
    document.getElementById('win-title').textContent = t('win_title');
    document.getElementById('win-sub').textContent = t('win_sub');
    const c = activeCompany();
    const body = document.getElementById('win-body');
    const q = c && selectedOffer(c);
    if (!c || !q) { body.innerHTML = ''; return; }

    const fixedMonths = c.monthsRaw.map(kwh => kwh * q.rate);
    const spotMonths = c.monthsRaw.map((kwh, i) => kwh * (q.rate * seededFloat('spot' + i + c.id, 0.82, 1.24)));
    const fixedTotal = Math.round(fixedMonths.reduce((a, b) => a + b, 0));
    const spotTotal = Math.round(spotMonths.reduce((a, b) => a + b, 0));
    const delta = spotTotal - fixedTotal;
    const peak = Math.max(...fixedMonths, ...spotMonths);

    const bars = c.monthsRaw.map((_, i) =>
      '<div class="eb-bar-col">' +
      '<div style="display:flex;gap:2px;align-items:flex-end;height:100%;width:100%">' +
      '<div class="eb-bar-2" style="height:' + Math.round(fixedMonths[i] / peak * 100) + '%;flex:1"></div>' +
      '<div class="eb-bar" style="height:' + Math.round(spotMonths[i] / peak * 100) + '%;flex:1"></div>' +
      '</div><span class="eb-bar-month">' + (i + 1) + '</span></div>'
    ).join('');

    body.innerHTML =
      '<div class="eb-summary-grid">' +
      '<div class="eb-summary-card"><span class="eb-label">' + t('win_fixed') + '</span><div class="eb-summary-figure">' + eur(fixedTotal) + '</div></div>' +
      '<div class="eb-summary-card"><span class="eb-label">' + t('win_spot') + '</span><div class="eb-summary-figure">' + eur(spotTotal) + '</div></div>' +
      '<div class="eb-summary-card"><span class="eb-label">' + t('win_delta') + '</span><div class="eb-summary-figure" style="color:' + (delta >= 0 ? 'var(--success-text)' : 'var(--danger-text)') + '">' + (delta >= 0 ? '+' : '') + eur(delta) + '</div></div>' +
      '</div>' +
      '<div class="eb-card eb-mt-24">' +
      '<div class="eb-legend"><span class="eb-legend-dot is-dark"></span>' + t('legend_fixed') + '<span style="width:16px"></span><span class="eb-legend-dot"></span>' + t('legend_spot') + '</div>' +
      '<div class="eb-bars eb-mt-16">' + bars + '</div>' +
      '</div>';
  }

  /* =====================================================================
     Render dispatcher
     ===================================================================== */
  function render() {
    renderChrome();
    if (state.screen === 'dashboard') renderDashboard();
    if (state.screen === 'rfq') renderRfq();
    if (state.screen === 'sign') renderSign();
    if (state.screen === 'win') renderWin();
  }

  /* =====================================================================
     Smart-ID modal — reused for login (landing) and signing (sign screen)
     ===================================================================== */
  const overlay = document.getElementById('smartid-modal-overlay');
  const stepForm = document.getElementById('smartid-step-form');
  const stepPolling = document.getElementById('smartid-step-polling');
  const stepSuccess = document.getElementById('smartid-step-success');
  const formError = document.getElementById('smartid-form-error');
  const startBtn = document.getElementById('smartid-start-btn');

  function openSmartIdModal(mode) {
    state.smartId.mode = mode;
    document.getElementById('smartid-modal-title').textContent = mode === 'login' ? t('modal_login_title') : t('modal_sign_title');
    document.getElementById('smartid-hint').textContent = t('modal_hint');
    document.getElementById('smartid-confirm-hint').textContent = t('modal_confirm_hint');
    document.getElementById('smartid-waiting-label').textContent = t('modal_waiting');
    document.getElementById('smartid-cancel-btn').textContent = t('modal_cancel');
    document.getElementById('smartid-success-label').textContent = t('modal_success');
    document.getElementById('smartid-done-btn').textContent = t('modal_done');
    startBtn.textContent = t('modal_start');
    document.getElementById('smartid-country').value = state.country;
    stepForm.classList.remove('eb-hidden'); stepPolling.classList.add('eb-hidden'); stepSuccess.classList.add('eb-hidden');
    formError.classList.add('eb-hidden');
    startBtn.disabled = false;
    overlay.classList.add('is-open');
  }
  function closeSmartIdModal() {
    overlay.classList.remove('is-open');
    clearTimeout(state.smartId.pollTimer);
    state.smartId.pollTimer = null;
  }
  document.getElementById('smartid-modal-close').addEventListener('click', closeSmartIdModal);
  document.getElementById('smartid-cancel-btn').addEventListener('click', closeSmartIdModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeSmartIdModal(); });

  const POLL_INTERVAL_MS = 1500, POLL_MAX_ATTEMPTS = 60;
  async function pollSmartId(sessionId, attempt) {
    attempt = attempt || 1;
    let poll;
    try {
      poll = await apiFetch('/api/auth/smart-id/poll/' + encodeURIComponent(sessionId));
    } catch (err) {
      stepPolling.classList.add('eb-hidden'); stepForm.classList.remove('eb-hidden');
      formError.textContent = err.message; formError.classList.remove('eb-hidden');
      return;
    }
    if (poll.status === 'RUNNING') {
      if (attempt >= POLL_MAX_ATTEMPTS) {
        stepPolling.classList.add('eb-hidden'); stepForm.classList.remove('eb-hidden');
        formError.textContent = 'Timed out. Please try again.'; formError.classList.remove('eb-hidden');
        return;
      }
      state.smartId.pollTimer = setTimeout(() => pollSmartId(sessionId, attempt + 1), POLL_INTERVAL_MS);
      return;
    }
    if (poll.status === 'COMPLETE' && poll.token) {
      state.auth.token = poll.token;
      state.auth.displayName = poll.displayName || '';
      stepPolling.classList.add('eb-hidden');
      stepSuccess.classList.remove('eb-hidden');
      return;
    }
    stepPolling.classList.add('eb-hidden'); stepForm.classList.remove('eb-hidden');
    formError.textContent = 'Smart-ID confirmation failed. Please try again.'; formError.classList.remove('eb-hidden');
  }

  startBtn.addEventListener('click', async () => {
    const countryCode = document.getElementById('smartid-country').value;
    const nationalIdentityNumber = document.getElementById('smartid-national-id').value.trim();
    formError.classList.add('eb-hidden');
    if (!nationalIdentityNumber) { formError.textContent = 'Enter a national identity number.'; formError.classList.remove('eb-hidden'); return; }
    startBtn.disabled = true;
    try {
      const start = await apiFetch('/api/auth/smart-id/start', { method: 'POST', body: JSON.stringify({ countryCode, nationalIdentityNumber }) });
      document.getElementById('smartid-verification-code').textContent = start.verificationCode;
      stepForm.classList.add('eb-hidden'); stepPolling.classList.remove('eb-hidden');
      pollSmartId(start.sessionId);
    } catch (err) {
      formError.textContent = 'Could not start Smart-ID: ' + err.message; formError.classList.remove('eb-hidden');
    } finally {
      startBtn.disabled = false;
    }
  });

  document.getElementById('smartid-done-btn').addEventListener('click', () => {
    closeSmartIdModal();
    if (state.smartId.mode === 'login') {
      if (!state.companies.length) {
        const tmpl = COMPANY_TEMPLATES.find(t => t.country === state.country) || COMPANY_TEMPLATES[0];
        const session = newCompanySession(tmpl, 0);
        state.companies.push(session);
        state.activeCompanyId = session.id;
      }
      setScreen('dashboard');
      toast('Signed in as ' + state.auth.displayName);
    } else {
      const c = activeCompany();
      c.signCompleted = true;
      toast(t('signed_banner'));
      setTimeout(() => setScreen('dashboard'), 900);
    }
  });

  /* =====================================================================
     Event wiring
     ===================================================================== */
  document.body.addEventListener('click', async (e) => {
    const el = e.target;

    if (el.closest('[data-action="go-landing"]')) { setScreen('landing'); return; }
    if (el.closest('[data-action="go-dashboard"]')) { e.preventDefault(); setScreen('dashboard'); return; }
    if (el.closest('[data-action="go-win"]')) { e.preventDefault(); setScreen('win'); return; }

    const langBtn = el.closest('[data-lang]');
    if (langBtn) { state.language = langBtn.dataset.lang; render(); return; }

    const countryBtn = el.closest('#landing-country-picker [data-country]');
    if (countryBtn) {
      state.country = countryBtn.dataset.country;
      state.language = COUNTRY_LANG[state.country];
      render();
      return;
    }

    if (el.id === 'landing-cta') { openSmartIdModal('login'); return; }

    if (el.id === 'advanced-toggle') { state.advancedView = !state.advancedView; render(); return; }

    const companyChip = el.closest('[data-company]');
    if (companyChip) { state.activeCompanyId = companyChip.dataset.company; render(); return; }

    if (el.id === 'add-company-btn') {
      const idx = state.companies.length % COMPANY_TEMPLATES.length;
      const session = newCompanySession(COMPANY_TEMPLATES[idx], state.companies.length);
      state.companies.push(session);
      state.activeCompanyId = session.id;
      setScreen('dashboard');
      return;
    }

    if (el.closest('#upload-zone')) {
      const c = activeCompany(); if (!c) return;
      c.uploadStatus = 'uploading'; render();
      setTimeout(() => {
        c.uploadStatus = 'done'; c.consumptionStatus = 'analyzing'; render();
        setTimeout(() => {
          c.consumptionStatus = 'fetching'; render();
          setTimeout(() => { c.consumptionStatus = 'ready'; render(); }, 1500);
        }, 1300);
      }, 1100);
      return;
    }

    const metricToggle = el.closest('[data-metric-toggle]');
    if (metricToggle) {
      const c = activeCompany();
      const i = Number(metricToggle.dataset.metricToggle);
      c.includeMetrics[i] = !c.includeMetrics[i];
      render();
      return;
    }

    if (el.id === 'dash-cta') { setScreen('rfq'); return; }

    const quoteRadio = el.closest('input[name="quote"]');
    if (quoteRadio) { activeCompany().selectedQuoteId = quoteRadio.value; return; }
    const rfqRow = el.closest('.eb-table tbody tr');
    if (rfqRow && rfqRow.querySelector('input[name="quote"]') && el.tagName !== 'INPUT') {
      rfqRow.querySelector('input[name="quote"]').checked = true;
      activeCompany().selectedQuoteId = rfqRow.querySelector('input[name="quote"]').value;
      return;
    }

    if (el.id === 'toggle-request-text') { const c = activeCompany(); c.showRequestText = !c.showRequestText; renderRfq(); return; }
    if (el.id === 'monthly-check-toggle') { const c = activeCompany(); c.monthlyCheck = !c.monthlyCheck; renderRfq(); return; }

    if (el.id === 'btn-get-quotes') {
      const c = activeCompany();
      c.rfqStage = 'sending'; renderRfq();
      setTimeout(() => {
        c.quotes = c.suppliers.map(s => ({
          id: 'quote-' + s.supplierId, supplierId: s.supplierId, supplierName: s.supplierName,
          plan: s.plan, rate: Math.max(0.08, s.rate * seededFloat('personal' + s.supplierId, 0.86, 0.94)), type: s.type,
        }));
        c.rfqStage = 'received';
        renderRfq();
      }, 1400);
      return;
    }

    if (el.id === 'btn-request-contract') {
      const c = activeCompany();
      if (!c.selectedQuoteId) {
        const rows = rfqRows(c);
        if (!rows.length) return;
        c.selectedQuoteId = rows[0].id;
      }
      setScreen('sign');
      return;
    }

    if (el.id === 'btn-sign-smartid') { openSmartIdModal('sign'); return; }

    if (el.id === 'btn-download-unsigned' || el.id === 'btn-download-pdf') {
      const c = activeCompany();
      const q = c.quotes.find(x => x.id === c.selectedQuoteId) || c.suppliers.find(x => x.id === c.selectedQuoteId);
      const text = 'EASY BREAK — CONTRACT\n\nCompany: ' + c.company.name + '\nSupplier: ' + q.supplierName + '\nPlan: ' + q.plan + '\nRate: ' + q.rate.toFixed(3) + ' EUR/kWh\nStart date: ' + (q.startDate || '') + '\nStatus: ' + (c.signCompleted ? 'SIGNED' : 'UNSIGNED DRAFT') + '\n';
      const blob = new Blob([text], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = c.company.name.replace(/\s+/g, '-') + '-contract.txt';
      a.click();
      URL.revokeObjectURL(a.href);
      return;
    }
  });

  /* Init */
  renderLangPills('lang-pills-landing');
  render();
})();
</script>
</body>
</html>
